<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F0EEE8" />
    <meta
      name="description"
      content="Avant d’engager de l’argent, on interroge vos clients, on relit votre business plan et on construit ce qui a été validé. À Valenciennes et à Lille."
    />
    <title>Reskope · On vous aide à décider, et on construit la suite</title>
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Partage social : sans ces balises, un lien collé sur LinkedIn n'affiche aucune vignette -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Reskope" />
    <meta property="og:title" content="Reskope · On vous aide à décider, et on construit la suite" />
    <meta
      property="og:description"
      content="Avant d’engager de l’argent, on interroge vos clients, on relit votre business plan et on construit ce qui a été validé. À Valenciennes et à Lille."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reskope · On vous aide à décider, et on construit la suite" />
    <meta
      name="twitter:description"
      content="Avant d’engager de l’argent, on interroge vos clients, on relit votre business plan et on construit ce qui a été validé."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.png" />

    <!-- Référencement local : remplacé page par page au pré-rendu (scripts/prerender.mjs) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Reskope",
        "description": "On interroge les clients des dirigeants de TPE et PME, on relit leur business plan et on construit ce qui a été validé.",
        "url": "%VITE_SITE_URL%",
        "founder": [
          { "@type": "Person", "name": "Thomy Phanzu" },
          { "@type": "Person", "name": "Florian Bouchart" }
        ],
        "areaServed": { "@type": "AdministrativeArea", "name": "Hauts-de-France" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Valenciennes",
          "addressRegion": "Hauts-de-France",
          "addressCountry": "FR"
        }
      }
    </script>
    <link
      rel="preload"
      href="/fonts/NeueEinstellung-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/NeueEinstellung-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
