    <meta property="og:site_name" content="Reskope" />
    <meta property="og:title" content="Reskope — Conseil & ingénierie numérique" />

      property="og:description"
      content="J'audite vos outils sur le terrain, salarié par salarié, puis je relie, simplifie et construis ce qui manque. Bilan garanti : s'il ne vous apporte rien, vous ne le payez pas."

      name="twitter:description"

        "name": "Reskope",
        "description": "Audit, cartographie et refonte des outils et processus numériques des TPE et PME.",
        "url": "https://floops10.github.io/reskope/",
        "email": "hello@reskope.fr",
        "founder": { "@type": "Person", "name": "Florian Bouchart" },
        "areaServed": { "@type": "AdministrativeArea", "name": "Hauts-de-France" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Valenciennes",
          "addressRegion": "Hauts-de-France",
          "addressCountry": "FR"
        },
        "priceRange": "€€"
      }
