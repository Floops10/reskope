<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Le R du logo (scripts/logo.py) : mêmes nœuds, mêmes rapports. Seule
       entorse, pour rester lisible à 16 px : traits x1,5 et nœuds x1,2. -->
  <rect width="32" height="32" rx="7" fill="#1C0CB3" />
  <g stroke="#F0EEE8" stroke-width="1.08" stroke-linecap="round" fill="none">
    <line x1="7.87" y1="5" x2="7.87" y2="16.96" />
    <line x1="7.87" y1="16.96" x2="7.87" y2="27" />
    <line x1="7.87" y1="5" x2="21.26" y2="5" />
    <line x1="21.26" y1="5" x2="24.13" y2="12.65" />
    <line x1="24.13" y1="12.65" x2="7.87" y2="16.96" />
    <line x1="7.87" y1="16.96" x2="24.13" y2="27" />
  </g>
  <g fill="#F0EEE8">
    <circle cx="7.87" cy="5" r="1.58" />
    <circle cx="21.26" cy="5" r="1.58" />
    <circle cx="24.13" cy="12.65" r="1.58" />
    <circle cx="7.87" cy="16.96" r="2.01" />
    <circle cx="7.87" cy="27" r="1.58" />
    <circle cx="24.13" cy="27" r="1.58" />
  </g>
</svg>
