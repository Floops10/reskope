      /* Reprise du chemin mis de côté par 404.html : GitHub Pages sert ce

        try {
          var r = sessionStorage.getItem('reskope-route');
          if (r) {
            sessionStorage.removeItem('reskope-route');
            history.replaceState({}, '', '/reskope/' + r);

      })();
