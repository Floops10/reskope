<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de visite — Reskope</title>
  <style>
    @font-face {
      font-family: 'Reskope Sans';
      src: url('./ReskopeSans-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Reskope Sans';
      src: url('./ReskopeSans-Medium.ttf') format('truetype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Reskope Sans';
      src: url('./ReskopeSans-SemiBold.ttf') format('truetype');
      font-weight: 600; font-style: normal; font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Reskope Sans', 'Helvetica Neue', system-ui, sans-serif;
      background: #0e0b1f;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #f0eee8;
    }
    .panel {
      width: 100%;
      max-width: 560px;
      background: #17142a;
      border-radius: 16px;
      padding: clamp(1.5rem, 4vw, 2.5rem);
      box-shadow: 0 48px 96px rgba(0,0,0,0.55);
      border: 1px solid rgba(240,238,232,0.07);
    }
    .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #b7b3a9;
      margin-bottom: 0.3rem;
    }
    h1 {
      font-size: clamp(1.15rem, 2.4vw, 1.5rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 1.4rem;
    }
    /* La carte est verticale : 55 × 85 mm. */
    .flip-wrap {
      width: min(100%, 320px);
      aspect-ratio: 550 / 850;
      perspective: 1800px;
      margin: 0 auto 1.5rem;
    }
    .flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .flip-inner.is-back { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(28,12,179,0.28);
    }
    .face--back { transform: rotateY(180deg); }
    .face svg { display: block; width: 100%; height: auto; }
    .controls { display: flex; flex-direction: column; gap: 1rem; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field-label { font-size: 0.82rem; font-weight: 500; color: #b7b3a9; }
    input[type="text"] {
      background: rgba(240,238,232,0.06);
      border: 1px solid rgba(240,238,232,0.13);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: #f0eee8;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    input[type="text"]:focus { border-color: rgba(240,238,232,0.32); }
    input[type="text"]::placeholder { color: rgba(240,238,232,0.26); }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    button {
      flex: 1;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      border-radius: 999px;
      padding: 0.75rem 1.4rem;
      cursor: pointer;
      transition: opacity 0.15s;
      border: none;
    }
    button:hover { opacity: 0.82; }
    #btnFlip { background: transparent; border: 1px solid rgba(240,238,232,0.18); color: #f0eee8; }
    #btnDl   { background: #1c0cb3; color: #f0eee8; }
    .note { font-size: 0.78rem; color: #b7b3a9; line-height: 1.6; }
  </style>
</head>
<body>
<main class="panel">
  <p class="eyebrow">Carte de visite</p>
  <h1>Personnalisez et téléchargez.</h1>

  <div class="flip-wrap">
    <div class="flip-inner" id="flipInner">

      <!-- ——— RECTO ——— -->
      <div class="face face--front">
        <svg id="svgFront" viewBox="0 0 550 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte de visite, recto">
          <defs><clipPath id="clipFront"><rect width="550" height="850" rx="26"/></clipPath></defs>
          <g id="corpsRecto" clip-path="url(#clipFront)"></g>
        </svg>
      </div>

      <!-- ——— VERSO ——— -->
      <div class="face face--back">
        <svg id="svgBack" viewBox="0 0 550 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte de visite, verso">
          <defs><clipPath id="clipBack"><rect width="550" height="850" rx="26"/></clipPath></defs>
          <g id="corpsVerso" clip-path="url(#clipBack)"></g>
        </svg>
      </div>

    </div>
  </div>

  <div class="controls">
    <label class="field">
      <span class="field-label">Pour (optionnel, visible sur le recto)</span>
      <input type="text" id="pourInput" placeholder="Nom du destinataire" maxlength="28">
    </label>
    <div class="actions">
      <button id="btnFlip">Voir le verso ↺</button>
      <button id="btnDl">Télécharger le recto ↓</button>
    </div>
    <p class="note">Fichier vectoriel · 55 × 85 mm, format vertical · recto &amp; verso · à ouvrir dans Illustrator, Figma ou chez votre imprimeur.</p>
  </div>
</main>

<script src="carte-visite.js"></script>
<script>
  /* La carte de qui ? ?qui=thomy (Florian par défaut). Le dessin est celui du
     site et des fichiers de l'imprimeur (carte-visite.js). */
  var SITE = 'reskope.fr';
  var PERSONNES = {
    florian: { prenom: 'Florian', nom: 'Bouchart', titre: 'Cofondateur', domaine: ['Discovery, sites et outils'], tel: '+33 6 20 23 55 20', mail: 'florian.bouchart@hotmail.fr' },
    thomy: { prenom: 'Thomy', nom: 'Phanzu', titre: 'Cofondatrice', domaine: ['Business plan, marque', 'et financement'], tel: '+33 7 61 25 44 65', mail: 'thomyphanzu@icloud.com' }
  };
  var quiParam = new URLSearchParams(window.location.search).get('qui');
  var qui = PERSONNES[quiParam] ? quiParam : 'florian';
  var side = 'front';
  var flipInner = document.getElementById('flipInner');
  var pourInput = document.getElementById('pourInput');
  var btnFlip   = document.getElementById('btnFlip');
  var btnDl     = document.getElementById('btnDl');

  function dessiner() {
    var C = window.CarteVisite;
    if (!C) return;
    document.getElementById('corpsRecto').innerHTML = C.recto(PERSONNES[qui], { geo: C.GEO, adresse: SITE, pour: pourInput.value.trim(), pourMot: 'Pour' });
    document.getElementById('corpsVerso').innerHTML = C.verso({ geo: C.GEO, adresse: SITE });
  }
  dessiner();
  pourInput.addEventListener('input', dessiner);

  btnFlip.addEventListener('click', function () {
    side = side === 'front' ? 'back' : 'front';
    flipInner.classList.toggle('is-back');
    btnFlip.textContent = side === 'front' ? 'Voir le verso ↺' : 'Voir le recto ↺';
    btnDl.textContent   = side === 'front' ? 'Télécharger le recto ↓' : 'Télécharger le verso ↓';
  });

  btnDl.addEventListener('click', function () {
    var svgEl = document.getElementById(side === 'front' ? 'svgFront' : 'svgBack');
    var str   = new XMLSerializer().serializeToString(svgEl);
    if (!str.startsWith('<?xml')) str = '<?xml version="1.0" encoding="UTF-8"?>\n' + str;
    var blob = new Blob([str], { type: 'image/svg+xml;charset=utf-8' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    var pour = pourInput.value.trim();
    var suffix = side === 'front'
      ? (pour ? 'recto-' + pour.toLowerCase().replace(/\s+/g, '-') : 'recto')
      : 'verso';
    a.download = 'reskope-carte-' + qui + '-' + suffix + '.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
