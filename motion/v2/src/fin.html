  <!-- La signature : le R, le logo, la phrase de marque, l'appel -->
  <div class="plan" id="p-fin">
    <svg id="logo" class="logo" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Reskope">
      <defs><clipPath id="coupe-mot" clipPathUnits="userSpaceOnUse"><rect id="coupe-rect" x="150" y="0" width="0" height="200"></rect></clipPath></defs>
      <g id="logo-groupe">
        <g id="logo-r">
          <g fill="none" stroke="#F0EEE8" stroke-width="3" stroke-linecap="round">
            <path d="M36 30L36 80"/><path d="M36 80L36 122"/><path d="M36 30L92 30"/><path d="M92 30L104 62"/><path d="M104 62L36 80"/><path d="M36 80L104 122"/>
          </g>
          <g fill="#F0EEE8">
            <circle cx="36" cy="30" r="5.5"/><circle cx="92" cy="30" r="5.5"/><circle cx="104" cy="62" r="5.5"/>
            <circle cx="36" cy="80" r="7"/><circle cx="36" cy="122" r="5.5"/><circle cx="104" cy="122" r="5.5"/>
          </g>
        </g>
        <g clip-path="url(#coupe-mot)"><path id="logo-mot" fill="#F0EEE8" d="{{MOT_LOGO}}"/></g>
      </g>
    </svg>
    <div class="bloc sous" id="fin-slogan">
      <div class="ligne" data-mots>On vous aide à décider,</div>
      <div class="ligne" data-mots>et on construit la suite.</div>
    </div>
    <div class="bloc" id="fin-appel">
      <span class="pilule" id="pilule"><b><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M8 15h14M16 9l6 6-6 6" fill="none" stroke="#1C0CB3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></b>{{APPEL}}</span>
    </div>
    <div class="bloc url" id="fin-url">reskope.fr</div>
  </div>
